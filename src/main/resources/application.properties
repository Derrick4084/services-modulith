# ===============================
# Application
# ===============================
server.port=8079
spring.application.name=EcommApp
spring.profiles.active=dev


bootui.enabled=OFF

spring.jpa.properties.hibernate.default_schema=platform


spring.data.redis.database=0
spring.data.redis.host=10.0.0.227
spring.data.redis.port=6379
spring.data.redis.timeout=60000

spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0



# ===============================
# Thymeleaf
# ===============================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false


# =================================
# PostgreSQL Datasource AWS
# ==================================
spring.datasource.url=jdbc:postgresql://10.0.0.227:5432/ecomm
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database=postgresql
spring.jpa.show-sql=true

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-description=init
spring.flyway.baseline-version=0
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.default-schema=platform

# ======================================
# This secret key is just for testing.
# Create it in Secrets Manager
# ========================================
app.jwt.secret.key=a1b2c3d4e5f6g7h8i9jijflslkdfjs93rsjnvf09ifnks0jijijrjvodnjdjnkkhdvm

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always


#logging.level.org.springframework.transaction=TRACE
#logging.level.org.hibernate.SQL=DEBUG


# ===============================
# Optional Management / Tracing
# ===============================
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=http://10.0.0.227:9411/api/v2/spans

